      <stop offset="0" stop-color="#3d9563"/>
      <stop offset="1" stop-color="#1a7045"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#d6e6db" stroke-width="1"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
