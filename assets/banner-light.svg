    <text x="52" y="198" font-family="monospace" font-size="17" letter-spacing="2" fill="#476655">SECURITY / TOOLS / MINECRAFT</text>
    <path d="M50 224H677" stroke="#cfdfd4"/>
    <text x="51" y="259" font-family="monospace" font-size="15" fill="#247e4d">$ <tspan fill="#4a6c56">keep curious, keep building</tspan><tspan fill="#247e4d"> _</tspan></text>
    <g stroke="#3f885b" stroke-width="1.7" stroke-linejoin="round">
