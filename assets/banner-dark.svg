<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">GuBai — Security, Tools &amp; Minecraft</title>
  <desc id="desc">A green terminal-inspired banner with three connected isometric blocks. Keep curious, keep building.</desc>
  <defs>
