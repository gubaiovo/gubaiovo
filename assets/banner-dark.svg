    <text x="52" y="198" font-family="monospace" font-size="17" letter-spacing="2" fill="#b7cbbf">SECURITY / TOOLS / MINECRAFT</text>
    <path d="M50 224H677" stroke="#293d32"/>
    <text x="51" y="259" font-family="monospace" font-size="15" fill="#8ce4b0">$ <tspan fill="#a5b9ad">keep curious, keep building</tspan><tspan fill="#8ce4b0"> _</tspan></text>
    <g stroke="#7cdb9f" stroke-width="1.7" stroke-linejoin="round">
